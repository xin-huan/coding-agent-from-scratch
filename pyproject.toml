[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-from-scratch"
version = "0.1.0"
description = "A lightweight coding agent built from scratch"
requires-python = ">=3.10"
dependencies = ["openai>=1.0"]

[project.scripts]
coding-agent = "coding_agent.cli:main"
coding-agent-chat = "coding_agent.chat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"coding_agent.skills" = ["builtin/*.md"]
